<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />

    <title>Numberle - A daily number game</title>
    <meta
      name="description"
      content="Guess the hidden number in 6 tries. A new puzzle is available each day."
    />

    <!--
    Numberle has moved to numberle.com.
    The script must stay ABOVE the meta-refresh: it runs first and carries
    the player's saved stats to the new site; the meta-refresh is the
    no-JS/crawler fallback.
    -->
    <link rel="canonical" href="https://numberle.com/" />
    <script src="migrate-transfer.js"></script>
    <meta http-equiv="refresh" content="0; url=https://numberle.com/" />

    <meta name="theme-color" content="#a464aa" />
    <link rel="manifest" href="manifest.json" />
    <link
      href="images/numberle_logo_192x192.png"
      rel="shortcut icon"
      sizes="192x192"
    />
    <link href="images/numberle_logo_192x192.png" rel="apple-touch-icon" />
  </head>
  <body>
    <p>
      Numberle has moved to <a href="https://numberle.com/">numberle.com</a>.
    </p>
  </body>
</html>
